<!--

The card include takes the following arguments:
  link: the URL to link to
  title: the title to display on the card
  description: the description to display on the card
  image: the path to the image to display on the card

  
-->



<div class="card">
  <img src="{{ site.baseurl }}{{ include.image }}" style="width:100%">
  <div class="card-container">
     <h4>
       <a href="{{ include.link }}">{{ include.title }}</a>
     </h4>
     <p>{{ include.description }}</p>
  </div>
</div>
