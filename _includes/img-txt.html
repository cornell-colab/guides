  <!--

The image-text include takes the following arguments:
  image: the path to the image to display
  title: the title to display
  description: the description to display
  link: the URL to link to (optional)
  link_text: the text to display on the button (optional)
  
-->
  
  <div class="img-txt-container">
    <div class="img-box"><img src="{{ include.image }}"></div>
    <div class="text-box">
      <h4> {{ include.title }} </h4>
      <p> {{ include.description }} </p>
      {% if include.link %}
        {% include button.html link=include.link text=include.link_text %}
      {% endif %}
    </div>
  </div>
